<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passive-Aggressive Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <div class="window-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="title">RoastCalc v1.0</span>
    </div>

    <!-- Screen Section -->
    <div class="display-container">
      <div id="roast-text" class="roast">Ready to judge your math skills...</div>
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <!-- Keypad Grid -->
    <div class="keypad">
      <button class="btn btn-action" onclick="clearAll()">AC</button>
      <button class="btn btn-action" onclick="deleteLast()">DEL</button>
      <button class="btn btn-operator" onclick="appendOperator('%')">%</button>
      <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>

      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn btn-operator" onclick="appendOperator('*')">×</button>

      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn btn-operator" onclick="appendOperator('-')">−</button>

      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

      <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendDot('.')">.</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
